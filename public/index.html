<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduNova — Enterprise Online Learning Platform</title>
  <meta name="description" content="EduNova is a modern, enterprise-grade online learning platform empowering students, instructors, and administrators with 25+ courses, interactive video lessons, automated quizzes, and verifiable certificates." />

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Outfit', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            accent: {
              500: '#8b5cf6',
              600: '#7c3aed',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="bg-base text-main font-sans min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
  <!-- App SPA Frame -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Navbar dynamically mounted here -->
    <header id="navbar-container" class="sticky top-0 z-40 w-full"></header>

    <!-- Page View Main Mount Point -->
    <main id="view-container" class="flex-1 w-full"></main>

    <!-- Footer -->
    <footer id="footer-container" class="border-t border-glass py-10 bg-surface/90 text-subtle mt-auto">
      <div class="container mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-primary flex items-center justify-center text-white font-extrabold text-xl shadow-glow">
            E
          </div>
          <span class="font-heading font-extrabold text-2xl tracking-tight text-gradient">EduNova</span>
        </div>
        <p class="text-xs sm:text-sm text-center md:text-left">
          &copy; 2026 EduNova Online Learning Platform. Built with ES6+, Express & SQLite. All rights reserved.
        </p>
        <div class="flex items-center space-x-6 text-sm font-medium">
          <a href="#catalog" class="hover:text-primary transition-colors">Catalog</a>
          <a href="#dashboard" class="hover:text-primary transition-colors">Dashboard</a>
          <a href="#settings" class="hover:text-primary transition-colors">Settings</a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full px-4"></div>

  <!-- Modal Overlay Container -->
  <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md hidden opacity-0 transition-all duration-300 p-4"></div>

  <!-- Frontend App Scripts -->
  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/courseCard.js"></script>
  <script src="/js/components/videoPlayer.js"></script>
  <script src="/js/components/quizRunner.js"></script>
  <script src="/js/components/certViewer.js"></script>
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/catalog.js"></script>
  <script src="/js/pages/courseDetail.js"></script>
  <script src="/js/pages/learn.js"></script>
  <script src="/js/pages/quiz.js"></script>
  <script src="/js/pages/studentDash.js"></script>
  <script src="/js/pages/instructorDash.js"></script>
  <script src="/js/pages/adminDash.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/pages/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
